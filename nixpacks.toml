[phases.setup]
nixPkgs = ["dotnet-sdk_8"]

[phases.install]
cmds = [
    "cd api/LostAndFoundAPI && dotnet restore"
]

[phases.build]
cmds = [
    "cd api/LostAndFoundAPI && dotnet publish -c Release -o ./publish"
]

[start]
cmd = "cd api/LostAndFoundAPI && dotnet ./publish/LostAndFoundAPI.dll --urls=http://0.0.0.0:$PORT"

[variables]
ASPNETCORE_ENVIRONMENT = "Production"
ASPNETCORE_URLS = "http://0.0.0.0:$PORT"
